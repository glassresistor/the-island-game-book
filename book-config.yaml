title: The Island — A Reader Beware Gamebook
author: After Peter Watts
language: en-US
subject: CYOA / Hard SF
description: |
  A branching gamebook adaptation of Peter Watts' novelette "The Island".
  You are a caveman-teleop on the interstellar gateway ship Eriophora, and
  your mission has just found something alive, intelligent, and asking you to stop.
  Every choice rationed from a finite immortal life. Five endings, including
  the original and its opposite.
publisher: Free Editions
identifier: urn:reader-beware:the-island-1
# Interstitial "dead" pages dropped between each section and the next so a
# reader flipping through linearly can't get lost. Worded like long-term
# nuclear waste warning messages; choice links jump straight over them.
# Set `count: 0` (or delete this block) to turn them off.
dead_pages:
  count: 3
