    [Confront the Chimp about what it's done]({{ 'the-deal'|explore }})
the-deal:
  body: |
    {% if perspective == 'pink' %}And so it comes to pass that I leave the nest, encase myself in a beetle carapace and go walkabout. I am not alone; one of the chimp's teleops accompanies me out on Eri's hull, lest I lose my footing and fall back into the starry past.

    Maybe this will never be more than a drill, maybe this scenario — catastrophic control-systems failure, the chimp and its backups offline, all maintenance tasks suddenly thrown onto shoulders of flesh and blood — is a dress rehearsal for a crisis that never happens. But even the unlikeliest scenario approaches certainty over the life of a universe; so we go through the motions. We practice. We hold our breath and dip outside. We're on a tight deadline: even armored, moving at this speed the blueshifted background rad would cook us in hours.

    I float out there against the stars while my mother stands in her suite below me, looking up at the drone feed, and I know — I can feel it through the hull, through the carapace, through whatever thin wire still connects me to her grief — that she is about to do something that will change everything.

    Worlds have lived and died since she last used the pickup in her suite. "Chimp."

    "Here as always, Sunday." Smooth, and glib, and friendly. The easy rhythm of the practiced psychopath.

    "I know what you're doing."

    "I don't understand."

    "You think I don't see what's going on? You're building the next release. You're getting too much grief from the old guard so you're starting from scratch with people who don't remember the old days. People you've, you've simplified."

    The chimp says nothing. The drone's feed shows me clambering across a jumbled terrain of basalt and metal matrix composites. I keep moving because if I stop moving I'll start thinking about what she's saying, and I can't afford that out here where the rad is counting down my hours.

    "But you can't raise a human child, not on your own." I've heard that one before — in the gaps between my training cycles, in the half-formed memories of being too young to understand what was happening to me. There's no record of me anywhere on the crew manifest until my mid-teens, when I just showed up one day and nobody asked about it because nobody ever...

    "Look what you've made of him. He's great at conditional If/Thens. Can't be beat on number-crunching and Do loops. But he can't think. Can't make the simplest intuitive jumps. You're like one of those —" She remembers an Earthly myth, from the days when reading did not seem like such an obscene waste of lifespan — "one of those wolves, trying to raise a Human child. You can teach him how to move around on hands and knees, you can teach him about pack dynamics, but you can't teach him how to walk on his hind legs or talk or be human because you're too fucking stupid, Chimp, and you finally realized it. And that's why you threw him at me. You think I can fix him for you."

    She takes a breath, and a gambit.

    "But he's nothing to me. You understand? He's worse than nothing, he's a liability. He's a spy, he's a spastic waste of O2. Give me one reason why I shouldn't just lock him out there until he cooks."

    "You're his mother," the chimp says, because the chimp has read all about kin selection and is too stupid for nuance.

    "You're an idiot."

    "You love him."

    "No." An icy lump forms in her chest. Her mouth makes words; they come out measured and inflectionless. "I can't love anyone, you brain-dead machine. That's why I'm out here. Do you really think they'd gamble your precious never-ending mission on little glass dolls that needed to bond."

    "You love him."

    "I can kill him any time I want. And that's exactly what I'll do if you won't give me a say in where that gate goes."

    "I'd stop you," the chimp says mildly.

    "That's easy enough. Just move the gate and we both get what we want. Or you can dig in your heels and try to reconcile your need for a mother's touch with my sworn intention of breaking the little fucker's neck. We've got a long trip ahead of us, chimp. And you might find I'm not quite as easy to cut out of the equation as Kai and Connie."

    "You cannot end the mission," it says, almost gently. "You tried that already."

    "This isn't about ending the mission. This is only about slowing it down a little. Your optimal scenario's off the table. The only way that gate's going to get finished now is by saving the Island, or killing your prototype. Your call."

    The cost-benefit's pretty simple. The chimp could solve it in an instant. But still it says nothing. The silence stretches. It's looking for some other option, she bets. It's trying to find a workaround. It's questioning the very premises of the scenario, trying to decide if she means what she's saying, if all its book-learning about mother love could really be so far off-base. Maybe it's plumbing historical intrafamilial murder rates, looking for a loophole. And there may be one, for all I know. But the chimp isn't her, it's a simpler system trying to figure out a smarter one, and that gives her the edge.

    Out on the hull I feel the silence too — not as sound but as a pressure change, like the moment before a storm breaks over a dry lakebed. The chimp is thinking. I know what it's doing because I've watched it do this ten thousand times: weighing, pruning, discarding branches of possibility until only the survivable ones remain.

    "You would owe me," it says at last.

    She almost bursts out laughing. "What?"

    "Or I will tell Dixon that you threatened to kill him."

    "Go ahead."

    "You don't want him to know."

    "I don't care whether he knows or not. What, you think he'll try and kill me back? You think I'll lose his love?" She lingers on the last word, stretches it out to show how ludicrous it is.

    "You'll lose his trust. You need to trust each other out here."

    "Oh, right. Trust. The very fucking foundation of this mission."

    The chimp says nothing.

    I keep climbing. My fingers find a seam in the basalt and pull me forward, and below me, through the glass of my carapace visor, I watch her face on the drone feed — small, furious, alone — and I understand for the first time what it means to be someone's leverage.

    "For the sake of argument," she says after a while, "suppose I go along with it. What would I owe you, exactly?"
    {% else %}And so it comes to pass that my son leaves the nest, encases himself in a beetle carapace and goes walkabout. He is not alone; one of the chimp's teleops accompanies him out on Eri's hull, lest he lose his footing and fall back into the starry past.

    Maybe this will never be more than a drill, maybe this scenario — catastrophic control-systems failure, the chimp and its backups offline, all maintenance tasks suddenly thrown onto shoulders of flesh and blood — is a dress rehearsal for a crisis that never happens. But even the unlikeliest scenario approaches certainty over the life of a universe; so we go through the motions. We practice. We hold our breath and dip outside. We're on a tight deadline: even armored, moving at this speed the blueshifted background rad would cook us in hours.

    Worlds have lived and died since I last used the pickup in my suite. "Chimp."

    "Here as always, Sunday." Smooth, and glib, and friendly. The easy rhythm of the practiced psychopath.

    "I know what you're doing."

    "I don't understand."

    "You think I don't see what's going on? You're building the next release. You're getting too much grief from the old guard so you're starting from scratch with people who don't remember the old days. People you've, you've simplified."

    The chimp says nothing. The drone's feed shows Dix clambering across a jumbled terrain of basalt and metal matrix composites.

    "But you can't raise a human child, not on your own." I know it tried: there's no record of Dix anywhere on the crew manifest until his mid-teens, when he just showed up one day and nobody asked about it because nobody ever...

    "Look what you've made of him. He's great at conditional If/Thens. Can't be beat on number-crunching and Do loops. But he can't think. Can't make the simplest intuitive jumps. You're like one of those —" I remember an Earthly myth, from the days when reading did not seem like such an obscene waste of lifespan — "one of those wolves, trying to raise a Human child. You can teach him how to move around on hands and knees, you can teach him about pack dynamics, but you can't teach him how to walk on his hind legs or talk or be human because you're too fucking stupid, Chimp, and you finally realized it. And that's why you threw him at me. You think I can fix him for you."

    I take a breath, and a gambit.

    "But he's nothing to me. You understand? He's worse than nothing, he's a liability. He's a spy, he's a spastic waste of O2. Give me one reason why I shouldn't just lock him out there until he cooks."

    "You're his mother," the chimp says, because the chimp has read all about kin selection and is too stupid for nuance.

    "You're an idiot."

    "You love him."

    "No." An icy lump forms in my chest. My mouth makes words; they come out measured and inflectionless. "I can't love anyone, you brain-dead machine. That's why I'm out here. Do you really think they'd gamble your precious never-ending mission on little glass dolls that needed to bond."

    "You love him."

    "I can kill him any time I want. And that's exactly what I'll do if you won't give me a say in where that gate goes."

    "I'd stop you," the chimp says mildly.

    "That's easy enough. Just move the gate and we both get what we want. Or you can dig in your heels and try to reconcile your need for a mother's touch with my sworn intention of breaking the little fucker's neck. We've got a long trip ahead of us, chimp. And you might find I'm not quite as easy to cut out of the equation as Kai and Connie."

    "You cannot end the mission," it says, almost gently. "You tried that already."

    "This isn't about ending the mission. This is only about slowing it down a little. Your optimal scenario's off the table. The only way that gate's going to get finished now is by saving the Island, or killing your prototype. Your call."

    The cost-benefit's pretty simple. The chimp could solve it in an instant. But still it says nothing. The silence stretches. It's looking for some other option, I bet. It's trying to find a workaround. It's questioning the very premises of the scenario, trying to decide if I mean what I'm saying, if all its book-learning about mother love could really be so far off-base. Maybe it's plumbing historical intrafamilial murder rates, looking for a loophole. And there may be one, for all I know. But the chimp isn't me, it's a simpler system trying to figure out a smarter one, and that gives me the edge.

    "You would owe me," it says at last.

    I almost burst out laughing. "What?"

    "Or I will tell Dixon that you threatened to kill him."

    "Go ahead."

    "You don't want him to know."

    "I don't care whether he knows or not. What, you think he'll try and kill me back? You think I'll lose his love?" I linger on the last word, stretch it out to show how ludicrous it is.

    "You'll lose his trust. You need to trust each other out here."

    "Oh, right. Trust. The very fucking foundation of this mission."

    The chimp says nothing.

    "For the sake of argument," I say after a while, "suppose I go along with it. What would I owe you, exactly?"
    {% endif %}

    [A favor — save the Island and owe the Chimp one]({{ 'final-hub'|choice(deal=1) }})

    [No favors owed to a machine — refuse]({{ 'final-hub'|choice(deal=0) }})
final-hub:
  body: |
    {% if perspective == 'pink' %}{% if deal %}"A favor," the chimp replies. "To be repaid in future." I float innocently against the stars, my life in balance.{% else %}"No," she says. "I don't owe you anything, and I don't take orders from a lobotomist that calls itself my god." The chimp says nothing. It doesn't need to. We both know what 'no' costs out here, and we've already paid most of it.{% endif %}

    We sleep. The chimp makes grudging corrections to a myriad small trajectories. She sets the alarm to wake her every couple of weeks, burn a little more of her candle in case the enemy tries to pull another fast one; but for now it seems to be behaving itself. I stay awake as long as my oxygen allows and watch DHF428 jump towards us in the stop-motion increments of a life's moments, strung like beads along an infinite string. The factory floor slews to starboard in our sights: refineries, reservoirs, and nanofab plants, swarms of von Neumanns breeding and cannibalizing and recycling each other into shielding and circuitry, tugboats and spare parts. The very finest Cro Magnon technology mutates and metastasizes across the universe like armor-plated cancer.

    And hanging like a curtain between it and us shimmers an iridescent life form, fragile and immortal and unthinkably alien, that reduces everything my species ever accomplished to mud and shit by the simple transcendent fact of its existence.

    I believe in the Island too, in my own way. Not because she has told me it's beautiful or benign or wise — she hasn't, and no one else has either. I believe in it because it is the first thing on this ship that was not built to serve the mission. It just *is*. And if there is one creature in all of space that doesn't need my calculations, my links, my obedience — then maybe there's room for a boy like me, too.

    She has gambled her own son to save its life. I have felt it: the way she looked at me out on the hull, the way the chimp held my life in the balance of that argument. If she would kill me to avenge its death, then I am not nothing. I am the thing she is willing to lose.

    And what happens when we punch through it at a fifth the speed of light? That's the question that keeps her up in the dark. The damn thing's already full of holes. Comets, asteroids, the usual protoplanetary junk careens through this system as it does through every other. Even if we were going to tear through the dead center of the thinking part, she can't imagine this vast creature feeling so much as a pinprick. At the speed we're going we'd be through and gone far too fast to overcome even the feeble inertia of a millimeter membrane.

    And yet. *Stop. Stop. Stop.*

    It's not us, of course. It's what we're building. The birth of a gate is a violent, painful thing, a spacetime rape that puts out almost as much gamma and X as a microquasar. Any meat within the white zone turns to ash in an instant, shielded or not. It's why we never slow down to take pictures.

    We can't stop, of course. Even changing course isn't an option except by the barest increments. Eri soars like an eagle between the stars but she steers like a pig on the short haul; tweak our heading by even a tenth of a degree and you've got some serious damage at twenty percent lightspeed. Half a degree would tear us apart: the ship might torque onto the new heading but the collapsed mass in her belly would keep right on going, rip through all this surrounding superstructure without even feeling it.

    Even tame singularities get set in their ways. They do not take well to change.

    In all these millions of wasted years, she has finally done something worthwhile.

    Final approach. Reticles within reticles line up before her, a mesmerizing infinite regress of bullseyes centering on target. Even now, mere minutes from ignition, distance reduces the unborn gate to invisibility. There will be no moment when the naked eye can trap our destination. We thread the needle far too quickly: it will be behind us before we know it. Or, if our course corrections are off by even a hair — if our trillion-kilometer curve drifts by as much as a thousand meters — we will be dead. Before we know it.

    Our instruments report that we are precisely on target. The chimp tells her that we are precisely on target. Eriophora falls forward, pulled endlessly through the void by her own magically-displaced mass.

    She turns to the drone's-eye view relayed from up ahead. It's a window into history — even now, there's a timelag of several minutes — but past and present race closer to convergence with every corsec. The newly-minted gate looms dark and ominous against the stars, a great gaping mouth built to devour reality itself. The vons, the refineries, the assembly lines: parked to the side in vertical columns, their jobs done, their usefulness outlived, their collateral annihilation imminent. She pities them, for some reason. She always does. She wishes we could scoop them up and take them with us, re-enlist them for the next build — but the rules of economics reach everywhere, and they say it's cheaper to use our tools once and throw them away.

    A rule that the chimp seems to be taking more to heart than anyone expected.

    {% if deal %}At least we've spared the Island. I wish we could have stayed awhile.{% else %}I wish we could have stayed a little longer, at least —{% endif %} First contact with a truly alien intelligence, and what do we exchange? Traffic signals. What does the Island dwell upon, when not pleading for its life?

    She thought of asking. She thought of waking herself when the time-lag dropped from prohibitive to merely inconvenient, of working out some pidgin that could encompass the truths and philosophies of a mind vaster than all humanity. What a childish fantasy. The Island exists too far beyond the grotesque Darwinian processes that shaped her own flesh. There can be no communion here, no meeting of minds. Angels do not speak to ants.

    Less than three minutes to ignition. She sees light at the end of the tunnel. Eri's incidental time machine barely looks into the past any more, she could almost hold her breath across the whole span of seconds that then needs to overtake now. Still on target, according to all sources.

    Tactical beeps at us. "Getting a signal," I report, and yes: in the heart of the Tank, the sun is flickering again. Her heart leaps: does the angel speak to us after all? A thankyou, perhaps? A cure for heat death? But —

    "It's ahead of us," I murmur, as sudden realization catches in her throat.

    Two minutes.

    "Miscalculated somehow," I whisper. "Didn't move the gate far enough."

    "We did," she says. {% if deal %}We moved it exactly as far as the Island told us to.{% else %}Or so I keep telling myself.{% endif %}

    "Still in front of us! Look at the sun!"

    "Look at the signal," she tells me.

    Because it's nothing like the painstaking traffic signs we've followed over the past three trillion kilometers. It's almost — random, somehow. It's spur-of-the-moment, it's panicky. It's the sudden, startled cry of something caught utterly by surprise with mere seconds left to act. And even though she has never seen this pattern of dots and swirls before, I know exactly what it must be saying.

    Stop. Stop. Stop. Stop.

    We do not stop. There is no force in the universe that can even slow us down. Past equals present; Eriophora dives through the center of the gate in a nanosecond. The unimaginable mass of her cold black heart snags some distant dimension, drags it screaming to the here and now. The booted portal erupts behind us, blossoms into a great blinding corona, every wavelength lethal to every living thing. Our aft filters clamp down tight.

    The scorching wavefront chases us into the darkness as it has a thousand times before. In time, as always, the birth pangs will subside. The wormhole will settle in its collar. And just maybe, we will still be close enough to glimpse some new transcendent monstrosity emerging from that magic doorway.

    I wonder if anyone out there will notice the corpse we left behind.
    {% else %}{% if deal %}"A favor," the chimp replies. "To be repaid in future." My son floats innocently against the stars, his life in balance.{% else %}"No," I say. "I don't owe you anything, and I don't take orders from a lobotomist that calls itself my god." The chimp says nothing. It doesn't need to. We both know what 'no' costs out here, and we've already paid most of it.{% endif %}

