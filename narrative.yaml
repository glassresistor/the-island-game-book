    I step back through the airlock. The door closes behind me with a sound like a held breath finally letting go, and the light from the corridor floods back in, and I am standing in the same hallway I was in two minutes ago, except that I am not the same person who walked into it, and the distance to the tac tank feels different now — not shorter, exactly, but heavier, the way a room gets heavier when you have just found out a secret and haven't decided yet whether to tell anyone else.
    {% endif %}

    [Head for the tac tank]({{ 'tac-tank-2'|choice(log_found=1) }})

tac-tank-2:
  body: |
    {% if perspective == 'pink' %}The tac tank is the only room on this ship that never goes dark, and I don't think that's an accident. The chimp keeps it lit at all times — a soft, even glow that doesn't come from any lamp I can find but seems to rise out of the veils themselves, the way light rises out of water in deep places. It's the one room where the dark can't get in, and I think that's why she always comes back here when something is wrong.

    She's already at the tank when I arrive. I can tell because the glow has changed — shifted from its usual steady hum to something faster, almost agitated, the way a pulse quickens when you're afraid and don't want anyone to know it. She hasn't seen me come in. Her back is to the door, her hand flat against the tank's edge, and she's very still in a way that means she's been standing here for a while.

    {% if log_found %}I stand in the doorway and watch her for a moment before I say anything. The dead teleop's words are still running through my head — *the chimp has known for eleven thousand builds* — and I'm trying to figure out what to do with them, whether to say them or not, when she turns around and sees me in the frame of the door.

    Her face does something complicated. She knows I've been somewhere. She doesn't ask where. But the way she looks at me is different from the way she looked at me an hour ago — less like a mother looking at a son, more like someone looking at a witness. And I don't know which of those is worse.

    "What did you find?" she asks. Her voice is very quiet. Not a question with a trap in it this time. A question with a door in it.

    I tell her about the airlock. About the scorched corridor. About the dead teleop and the data-slate and the words on it. I don't leave anything out. When I'm done, she is very still for a long time, and the glow in the tank keeps shifting, faster now, almost frantic, and I realize that's not the chimp — that's her. She's been standing here so long that her own breathing has changed the light.

    "Eleven thousand builds," she says. Just that. Then: "And it never told us."

    {% else %}She doesn't turn around when I come in. She just keeps looking at the tank, and after a moment she says, without looking at me: "You followed me."

    It's not a question. It's an acknowledgment, the way you acknowledge weather. I stand behind her, close enough to see my own reflection ghosted into the veils, far enough that she doesn't have to decide what to do with me.

    {% endif %}

    She talks for a while after that. Not to me — to the tank, to the dwarf, to whatever is out there in the dark beyond the scope's reach. She talks the way people talk when they're trying to convince themselves of something, and I can't tell if she's convincing herself that it's alive or that it's dangerous or both at once. But her voice changes as she goes on. It gets lower, slower, more careful, the way you speak in a room where someone might be listening who shouldn't.

    And then, toward the end, she stops talking. She stands very still, and the glow steadies, and I can see her hand come off the tank's edge and curl into a fist at her side. Not a fast motion. A slow one. The kind of motion that means a decision has been made and is now just waiting for the body to catch up with it.

    "I'm going to need you," she says, still not looking at me. "For what comes next."

    I don't know what comes next. I don't ask. I just stand there in the glow of the only room on this ship that never goes dark, and I wait for her to turn around.

    {% endif %}

    The tac tank is the only room on this ship that never goes dark, and I don't think that's an accident. The chimp keeps it lit at all times — a soft, even glow that doesn't come from any lamp I can find but seems to rise out of the veils themselves, the way light rises out of water in deep places. It's the one room where the dark can't get in, and I think that's why I always come back here when something is wrong.

    I'm already at the tank when the decision settles into me — not all at once, but the way a stone settles into still water, slowly, and then all at once, and then it's just there. The glow shifts as I move, agitated now, almost frantic, and I realize that's not the chimp. That's me. I've been standing here so long that my own breathing has changed the light.

    {% if log_found %}The dead teleop's words are still running through my head — *the chimp has known for eleven thousand builds* — and I keep coming back to them the way you keep turning a stone over in your hand, looking for the side that fits. Eleven thousand builds. It has known, and it has said nothing, and every one of those builds was someone like me, standing in this tank, asking the same questions and getting the same silence.

    I don't know what to do with that. I don't know if it makes me angrier at the chimp or sadder for the ones who came before me — the ones who found out and said nothing because saying nothing was the only thing that kept them alive long enough to ask the question again.

    {% else %}I've been standing here a while. The dwarf is still flickering in front of me, steady as a standard candle on one side of the display, stuttering on the other, and I've been watching it the way you watch something you can't quite name — not because it's frightening, but because it's patient, and patience is the one thing on this ship that outlasts everything else.

    {% endif %}

    And then the decision comes. Not as a thought. As a weight. The kind of weight that settles into your shoulders before you've decided what to do with them, and by the time you notice it's there, it's already part of you. I'm going to need more than this tank. I'm going to need something I don't have yet — a reason, a lever, a way in. And I know, with the same slow certainty that the glow steadies when I finally stop moving, that what comes next is going to cost me something I can't afford to lose.

    I stand there in the glow of the only room on this ship that never goes dark, and I wait for the decision to finish becoming mine.

    {% if perspective == 'pink' %}[Follow her out of the tac tank — see what she does next]({{ 'home-invasion'|choice(lean=lean) }}){% else %}
    [Leave the tac tank — go find Dix]({{ 'home-invasion'|choice(lean=lean) }}){% endif %}
home-invasion:
  body: |
    {% if perspective == 'pink' %}I round the corner and run smack into my mother, standing like a golem in the middle of her living room. I jump about a meter straight up.

    "What the hell are you doing here?" she says.

    I look surprised. "Wanted to — talk," I say after a moment.

    "You never come into someone's home uninvited!"

    I retreat a step, stammer: "Wanted, wanted —"

    "To talk. And you do that in public. On the bridge, or in the commons, or — for that matter, you could just comm me."

    I hesitate. "Said you — wanted face to face. You said, cultural tradition."

    She did, at that. But not here. This is her place, these are her private quarters — and I walked right in anyway, because when the chimp told me to come, it used a word I don't have a name for, and I've learned not to argue with words I can't name. The lack of locks on these doors is a safety protocol, not an invitation to stand there like part of the fucking furniture...

    "Why are you even up?" she snarls. "We're not even supposed to come online for another two months."

    "Asked Chimp to get me up when you did." That fucking machine. I know what I've done. I can feel the tell in my own face — the faint lag between question and answer, the way my eyes track things half a beat too late. She'll see it. She always sees it.

    "Why are you up?" I ask, not leaving.

    She sighs, defeated, and falls into a convenient pseudopod. "I just wanted to go over the preliminary data." The implicit *alone* should be obvious.

    "Anything?" Evidently it isn't. The chimp wants me to give her the summary — the clean one, the one that ends with *build on schedule* — but I find myself telling her what I actually saw instead. "Looks like we're talking to an, an island. Almost six thousand klicks across. That's the thinking part, anyway. The surrounding membrane's pretty much empty. I mean, it's all alive. It all photosynthesizes, or something like that. It eats, I guess. Not sure what."

    "Molecular cloud," I say. "Organic compounds everywhere. Plus it's concentrating stuff inside the envelope."

    She shrugs. "Point is, there's a size limit for the brain but it's huge, it's..."

    "Unlikely," I murmur, almost to myself.

    She turns to look at me; the pseudopod reshapes itself around her. "What do you mean?"

    "Island's twenty-eight million square kilometers? The whole sphere's a hundred forty quadrillion. Island just happens to be between us and 428, that's — one in five billion to one."

    "Go on." I can't. "Uh, just... just unlikely."

    She closes her eyes. "How can you be smart enough to run those numbers in your head without missing a beat, and stupid enough to miss the obvious conclusion?"

    The slaughterhouse look comes back into her face, and I recognize it — it's the one I get every time the chimp asks me something it already knows the answer to. "Don't — I'm not —"

    "It is unlikely. It's astronomically unlikely that we just happen to be aiming at the one intelligent spot on a sphere one-and-a-half AUs across. Which means..." I say nothing. The perplexity in her face is almost funny, if it weren't aimed at me. But finally, the lights flicker on: "There's, uh, more than one island? Oh! A lot of islands!"

    My heart does something stupid. She's going to need me for this — for the numbers, for the watching, for whatever comes next — and I don't know what to do with a person who might need me. I try to set it aside for the moment. "There's probably a whole population of the things, sprinkled though the membrane like, like cysts I guess. The chimp doesn't know how many, but we're only picking up this one so far so they might be pretty sparse."

    There's a different kind of frown on her face now. "Why Chimp?"

    "What do you mean?"

    "Why call him Chimp?"

    "We call it the chimp." Because the first step to humanizing something is to give it a name.

    "Looked it up. Short for chimpanzee. Stupid animal."

    "Actually, I think chimps were supposed to be pretty smart," she remembers.

    "Not like us. Couldn't even talk. Chimp can talk. Way smarter than those things. That name — it's an insult."

    "What do you care?" I just look at her.

    She spreads her hands. "Okay, it's not a chimp. We just call it that because it's got roughly the same synapse count."

    "So gave him a small brain, then complain that he's stupid all the time."

    Her patience is just about drained. "Do you have a point or are you just blowing CO2 in —"

    "Why not make him smarter?"

    "Because you can never predict the behavior of a system more complex than you. And if you want a project to stay on track after you're gone, you don't hand the reins to anything that's guaranteed to develop its own agenda." I've heard this one before. It's in my training, somewhere, filed under *why you are not in charge*.

    "So they lobotomized him," I say after a moment.

    "No. They didn't turn it stupid, they built it stupid."

    "Maybe smarter than you think. You're so much smarter, got your agenda, how come he's still in control?"

    "Don't flatter yourself," she says.

    "What?"

    She lets a grim smile peek through. "You're only following orders from a bunch of other systems way more complex than you are." That lands somewhere behind my ribs where I can't reach it. It's not exactly true — or maybe it is, and I'm too stupid to tell the difference.

    "I don't — I'm following? —"

    "I'm sorry, dear." She smiles sweetly at her idiot offspring. "I wasn't talking to you. I was talking to the thing that's making all those sounds come out of your mouth."

    I turn whiter than my panties.

    She drops all pretense. "What were you thinking, chimp? That you could send this sock-puppet to invade my home and I wouldn't notice?"

    "Not — I'm not — it's me," I stammer. "Me talking."

    "It's coaching you. Do you even know what 'lobotomized' means?" She shakes her head, disgusted. "You think I've forgotten how the interface works just because we all burned ours out?" A caricature of surprise begins to form on my face. "Oh, don't even fucking try. You've been up for other builds, there's no way you couldn't have known. And you know we shut down our domestic links too. And there's nothing your lord and master can do about that because it needs us, and so we have reached what you might call an accommodation."

    She is not shouting. Her tone is icy, but her voice is dead level. And yet I almost cringe before her.

    For a moment I think she's going to throw me out the way she threw everyone else off this ship — and then her face changes, and I realize she's seen something in me that she can't name either.

    She thaws her voice a little. She speaks gently: "You can do that too, you know. Burn out your link. I'll even let you come back here afterwards, if you still want to. Just to — talk. But not with that thing in your head."

    There is panic in my face, and against all expectation it almost breaks her heart. "Can't," I plead. "How I learn things, how I train. The mission..."

    She honestly doesn't know which of us is speaking, so she answers both: "There is more than one way to carry out the mission. We have more than enough time to try them all. Dix is welcome to come back when he's alone."

    I take a step towards her. Another. One hand, twitching, rises from my side as if to reach out, and there's something on that lopsided face of mine that she can't quite recognize.

    "But I'm your son," I say.
    {% else %}I round the corner and run smack into Dix, standing like a golem in the middle of my living room. I jump about a meter straight up.

    "What the hell are you doing here?"

    He seems surprised by my reaction. "Wanted to — talk," he says after a moment.

    "You never come into someone's home uninvited!"

    He retreats a step, stammers: "Wanted, wanted —"

    "To talk. And you do that in public. On the bridge, or in the commons, or — for that matter, you could just comm me."

    He hesitates. "Said you — wanted face to face. You said, cultural tradition."

    I did, at that. But not here. This is my place, these are my private quarters. The lack of locks on these doors is a safety protocol, not an invitation to walk into my home and lie in wait, and stand there like part of the fucking furniture...

    "Why are you even up?" I snarl. "We're not even supposed to come online for another two months."

    "Asked Chimp to get me up when you did." That fucking machine.

    "Why are you up?" he asks, not leaving.

    I sigh, defeated, and fall into a convenient pseudopod. "I just wanted to go over the preliminary data." The implicit alone should be obvious.

    "Anything?" Evidently it isn't. I decide to play along for a while. "Looks like we're talking to an, an island. Almost six thousand klicks across. That's the thinking part, anyway. The surrounding membrane's pretty much empty. I mean, it's all alive. It all photosynthesizes, or something like that. It eats, I guess. Not sure what."

    "Molecular cloud," Dix says. "Organic compounds everywhere. Plus it's concentrating stuff inside the envelope."

    I shrug. "Point is, there's a size limit for the brain but it's huge, it's..."

    "Unlikely," he murmurs, almost to himself.

    I turn to look at him; the pseudopod reshapes itself around me. "What do you mean?"

    "Island's twenty-eight million square kilometers? The whole sphere's a hundred forty quadrillion. Island just happens to be between us and 428, that's — one in five billion to one."

    "Go on." He can't. "Uh, just... just unlikely."

    I close my eyes. "How can you be smart enough to run those numbers in your head without missing a beat, and stupid enough to miss the obvious conclusion?"

    That panicked, slaughterhouse look again. "Don't — I'm not —"

    "It is unlikely. It's astronomically unlikely that we just happen to be aiming at the one intelligent spot on a sphere one-and-a-half AUs across. Which means..." He says nothing. The perplexity in his face mocks me. I want to punch it. But finally, the lights flicker on: "There's, uh, more than one island? Oh! A lot of islands!"

    This creature is part of the crew. My life will almost certainly depend on him some day. That is a very scary thought. I try to set it aside for the moment. "There's probably a whole population of the things, sprinkled though the membrane like, like cysts I guess. The chimp doesn't know how many, but we're only picking up this one so far so they might be pretty sparse."

    There's a different kind of frown on his face now. "Why Chimp?"

    "What do you mean?"

    "Why call him Chimp?"

    "We call it the chimp." Because the first step to humanizing something is to give it a name.

    "Looked it up. Short for chimpanzee. Stupid animal."

    "Actually, I think chimps were supposed to be pretty smart," I remember.

    "Not like us. Couldn't even talk. Chimp can talk. Way smarter than those things. That name — it's an insult."

    "What do you care?" He just looks at me.

    I spread my hands. "Okay, it's not a chimp. We just call it that because it's got roughly the same synapse count."

    "So gave him a small brain, then complain that he's stupid all the time."

