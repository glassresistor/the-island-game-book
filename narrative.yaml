    Beyond the jammed door there's a corridor. It's narrow — half the width of the main halls — and the ceiling is low enough that I have to duck, and the light from the airlock doesn't reach it at all. But I can see shapes in the dark: equipment racks, their panels open, their contents gone. Cables hanging down like the frayed ends of a nervous system. And on the floor, about ten meters ahead, something that is not a cable.

    It's a body. Or what's left of one. The suit is still in place — the beetle carapace, the fiber-optic cable running into the back of the neck — but the person inside it has been gone for a very long time, and the suit has started to take on the shape of the dark around it, the way a stone takes on the shape of the water that moves over it. The visor is cracked. Through the crack I can see the face, or what's left of it: not a skeleton, not exactly, but something that has been slowly turned into the same material as the suit, the same dark, patient material that the chimp uses for everything it doesn't want me to find.

