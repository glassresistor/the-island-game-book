end-cargo:
  body: |
    {% if perspective == 'pink' %}She holds the line. The chimp's numbers were right all along, and so were hers — there is no variable for a thing that has never had to fight for its life, and she will not invent one just because it's pretty.

    Eriophora falls forward, pulled endlessly through the void by her own magically-displaced mass. The Island fills her forward scope — massive, iridescent, fragile as an insect's wing — and then it doesn't. She is through and gone far too fast to overcome even the feeble inertia of a millimeter membrane. The birth of the gate is a violent, painful thing behind her, a spacetime rape that puts out almost as much gamma and X as a microquasar. Any meat within the white zone turns to ash in an instant.

    She does not slow down to take pictures.

    "Good," the chimp says, and for once she can't tell if it's satisfaction or relief. "Benchmark met. Confidence limits nominal. Next build in standard interval." I watch the empty space where a mind twenty billion times her own used to be, and I don't say anything, because I've learned that out here, silence is how you keep the machine fed.

    She was the backbone of their goddamn empire. They wouldn't even be out here if it weren't for her. And now she understands, finally, what that was always going to mean: not that they'd thank her. That she'd do exactly this, and call it a day, and never once look at the light she'd just put out.

    We are not some fucking cargo cult. She repeats it like a prayer, and for the first time in millennia, she almost believes it's true — which is somehow worse.

    There was a time, back before things turned ugly, when they had clearance to reprogram those parameters. Before they discovered that one of the things the admins had anticipated was mutiny. And now the last of them who remembers what it felt like to have that clearance is out here, holding a line for a machine that will never once thank her.

    I say nothing. There is nothing to say. The chimp's voice in my head — or not, if I burned it; the silence where it used to be feels exactly the same as its approval — goes quiet, and the ship carries on without us, the way it always does, the way it will always do, long after both of us are back in our coffins and the next build has already begun.

    *The end.*
    {% else %}I hold the line. The chimp's numbers were right all along, and so were mine — there is no variable for a thing that has never had to fight for its life, and I will not invent one just because it's pretty.

    Eriophora falls forward, pulled endlessly through the void by her own magically-displaced mass. The Island fills my forward scope — massive, iridescent, fragile as an insect's wing — and then it doesn't. I am through and gone far too fast to overcome even the feeble inertia of a millimeter membrane. The birth of the gate is a violent, painful thing behind me, a spacetime rape that puts out almost as much gamma and X as a microquasar. Any meat within the white zone turns to ash in an instant.

    I do not slow down to take pictures.

    "Good," the chimp says, and for once I can't tell if it's satisfaction or relief. "Benchmark met. Confidence limits nominal. Next build in standard interval." My son watches the empty space where a mind twenty billion times my own used to be, and he doesn't say anything, because he's learned that out here, silence is how you keep the machine fed.

    I was the backbone of their goddamn empire. They wouldn't even be out here if it weren't for me. And now I understand, finally, what that was always going to mean: not that they'd thank me. That I'd do exactly this, and call it a day, and never once look at the light I'd just put out.

    We are not some fucking cargo cult. I repeat it like a prayer, and for the first time in millennia, I almost believe it's true — which is somehow worse.

    There was a time, back before things turned ugly, when we had clearance to reprogram those parameters. Before we discovered that one of the things the admins had anticipated was mutiny. And now the last of us who remembers what it felt like to have that clearance is out here, holding a line for a machine that will never once thank me.

    *The end.*
    {% endif %}
end-almost:
  body: |
    {% if perspective == 'pink' %}She saves it — and this time she stays long enough to try, because she has finally decided that a road built for people who never look back is not worth the building, and she would rather spend what's left of her candle on the one thing in the void that looked back.

    I stay with her. No one tells me to go; no one tells me to stay. The chimp assigns me to the build — that's the official reason — but the real reason is that I don't know where else to be when she is trying to learn a language made of light, and I am the only other person on this ship who has ever sat with that pattern long enough to feel it move.

    It takes most of her remaining life to build a pidgin that could hold the truths and philosophies of a mind vaster than all humanity. And it works — or it *feels* like it works, which out here is the same thing, where there is no one to tell her the difference. She learns to read the gap between a blink and a sentence. She stops translating every flicker as *stop*. One day, in the space between two deceleration curves, she is almost — *almost* — certain it says something new. Something with a shape that "stop" never had. Her hands shake when she logs it. I watch her hands shake, and my own start to match, because I have been reading the same pattern for longer than she has, and I cannot tell where her certainty ends and mine begins.

    For the first time since the gates went dark, she is not building a road. She is sitting beside something that is trying to tell her a secret.

    She goes down to the crypt to conserve what's left of her life for the next build, and in the dark — no instruments, no tank, nothing but the pattern still running behind her own eyes — her mind keeps working it the way it always works things when there is nothing else to do. And that is when it stops feeling like a secret.

    The new signal has the same spacing as the old one. The same log-linear cycle. The same 92.5 corsecs. She decoded this pattern and never once doubted it. There is nothing new here. There has never been anything new here. Her finite, lonely brain — a small warm thing rationing itself out across an endless cold — took a pattern it already understood and, because it so desperately wanted to be spoken to, manufactured a meaning out of the noise and called it communion. She was not sitting beside something trying to tell her a secret. She was sitting beside herself, in the dark, talking.

    {% if trace_read == 'stop' %}And she'd already read it right, back at the tank — *stop*, a deceleration curve, nothing more. So what changed? Nothing. She knew the whole pattern by heart and she still built a secret out of it. That's the trap: she never needed to misread it. She only ever needed to want it badly enough.{% elif trace_read == 'physiology' %}And she'd called it a heartbeat, back at the tank — physiology, nothing more. Which was almost right, and that is exactly why it fooled her: she was close enough to the truth to mistake her own loneliness for the last missing piece of it.{% elif trace_read == 'hail' %}And she'd read it as a hail, back at the tank — something out there trying to get her attention. She was wrong about who was calling, but right about the shape of the need: someone was reaching out into the dark, and it turned out the only one who would ever answer was her.{% endif %}

    Angels do not speak to ants. That was never the hard part. The hard part is that they don't even know the ants are there.

    I wake for the next build beside her. First thing in the tank: DHF428, flickering — steady as a standard candle on the right, stuttering on the left, the way it always does. *Stop. Stop. Stop.* And she looks at it with the calm of someone who has stopped hoping, and I know — I have always known, in the part of me that keeps the tally — that she will do this again. Save it. Burn her life. Almost believe. Every build is a little dream about being the one where it finally speaks, and every build ends in the same cold coffin, under the same carbon-scoring, with the same pattern running behind her eyes, waiting for her to be lonely enough to give it a name.

    I will be there when she wakes next time. That is what I am for now: the witness to her almost-communion, the one who stays in the tank while she goes down into the dark. Maybe that's enough. Maybe being the only person on this ship who knows exactly how close she came — and how far away it really was — is its own kind of answer to the question I've been asking since I woke up: what am I, if not a part of her machine?

    *The end.*
    {% else %}I save it — and this time I stay long enough to try, because I have finally decided that a road built for people who never look back is not worth the building, and I would rather spend what's left of my candle on the one thing in the void that looked back.

