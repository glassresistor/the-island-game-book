    {% if perspective == 'pink' %}
    [Move the gate — spare it]({{ 'end-weapon'|explore }})

    {% if not deal %}[Hold the line — let the mission run it over]({{ 'end-cargo'|explore }}){% endif %}

    [Stay with her to learn its language]({{ 'end-almost'|explore }})

    {% if dix_burned %}[Turn on the Chimp, together]({{ 'end-rebellion'|explore }}){% else %}[Burn out your own link and go quiet]({{ 'end-silence'|explore }}){% endif %}
    {% else %}
    [Move the gate — spare it]({{ 'end-weapon'|explore }})

