trace:
  body: |
    {% if perspective == 'pink' %}She doesn't shout back right away. There's time — ten million corsecs of it — and I've watched her long enough to know she never does a thing in a hurry when the alternative is to do it forever. So she sits with the trace, staring at it the way you stare at a lock you're trying to pick: patient, still, all of her attention in her hands.

    I stay in the tank beside her while she does it, because no one told me to go anywhere and the chimp hasn't spoken since the last number came back. Spacing on a log-linear increase, cycling every 92.5 corsecs. Each cycle opens at 13.2 clicks per corsec and degrades — the gaps widen, the rhythm slackens, each repetition a little farther from the last. Not accelerating. A deceleration curve, the way a thing slows as it comes to rest.

    The chimp offers its own verdict, the very voice of calm reason: "Most cyclic emanations from living sources are simple biorhythms. Not intelligent signals." She doesn't answer it. She just keeps watching the trace, her thumb moving along the edge of the tank in slow, measured passes — the way she does when she's working through something and doesn't want to say it out loud yet.

    I've already decided what it is, and I keep my mouth shut about it. Slowing toward zero. A countdown. It's asking to stop. I don't say it out loud — she'll decide for herself what the trace means, and that's her call, not mine. So I sit with it while she sits with it. The trace runs under both of us like a river we keep dipping our hands into, cold and patient.
    {% else %}I don't shout back right away. There's time — ten million corsecs of it — and I've never been good at doing a thing in a hurry when the alternative is to do it forever. So I sit with the trace, the way I used to sit with a problem before the old days, when problems were small enough to hold in my hands.

    The chimp can give me the numbers; it's worse than honest about that part. Spacing on a log-linear increase, cycling every 92.5 corsecs. Each cycle opens at 13.2 clicks per corsec and degrades — the gaps widen, the rhythm slackens, each repetition a little farther from the last. Not accelerating. A deceleration curve, the way a thing slows as it comes to rest.

    And here's the thing the chimp won't do for me: decide what a slowing-down is *for*. I've got three readings in my head and no instrument that can tell them apart. A steady thing repeats identically, cycle after cycle; this one doesn't. It's wearing itself out.

    The chimp offers its own verdict, the very voice of calm reason: "Most cyclic emanations from living sources are simple biorhythms. Not intelligent signals." As if I hadn't heard it before. As if biorhythm were a word that settles anything. And the chimp's confidence doesn't count as an instrument.

    So I sit with it. I let the trace run under me like a river I keep dipping my hand into, cold and patient.
    {% endif %}

    {% if perspective == 'pink' %}[It's a countdown, asking it to STOP — say nothing; let her decide what it means]({{ 'crypt'|choice(trace_read='stop') }}){% else %}
    [It's a heartbeat — a biorhythm, nothing more; it'll keep doing this forever]({{ 'crypt'|choice(trace_read='physiology') }})

    [Slowing toward zero — a countdown, asking me to STOP]({{ 'crypt'|choice(trace_read='stop') }})

    [A hailing pattern — something out there trying to get my attention]({{ 'crypt'|choice(trace_read='hail') }}){% endif %}
crypt:
  body: |
    {% if perspective == 'pink' %}She shouts back. No reason not to — I shout it too, right beside her, because I've been waiting ten months for this moment and I'm not going to let the chimp decide it for me. And now she dies again, because what's the point of staying up late? Whether or not this vast entity harbors real intelligence, our echo won't reach it for ten million corsecs — another ten, at the earliest, before we receive any reply. Might as well hit the crypt in the meantime. Shut down all desires and misgivings. Conserve whatever life she has left for moments that matter.

    I stay on the bridge. The chimp tells me to sleep; I don't want to, but it's already dimming the lights around my quarters like a hand closing over a lantern. So I lie in my coffin with my eyes open and watch the pattern run behind them, cycle after cycle, each one a little slower than the last, and I think about what it means to be the one who stays awake while everyone else goes down into the dark.

    She lingers in her coffin for a long while, and I don't ask what for — some victories she keeps to herself. The chimp's dead, blackened eye gazes down from the ceiling of her suite; in all these millions of years nobody's scrubbed off the carbon scoring. It's a trophy from the early incendiary days of her Great Struggle.

    I don't know what that feels like. My coffin has no trophies. Mine is clean, white, and silent, the way a classroom is silent before the test.

    She washes the rotten-egg stench from her hair and steps into Eriophora's silent cathedral hallways. Sure enough the enemy waits in the darkness, turns the lights on as she approaches, shuts them off behind her — but it does not break the silence. Not yet. The war has gone cold; she just goes through the motions now, rattling her chains like an old married multiplet resigned to hating each other to the end of time. After all the moves and countermoves, the truth is they need each other.

    She treats herself to a gratuitous meal in the starbow commons. Three hours after coming back to life, she calls up the forward feeds. DHF428 blinks at her from the center of the lounge: *Stop. Stop. Stop.* Maybe it's pure physiology. Maybe this endless cycle carries no more intelligence than the beating of a heart. But there's a pattern inside the pattern, some flicker in the blink — and I can see her lean forward into it, the way she does when something has caught her attention and won't let go.

    {% if lean == 'heart' %}I find I'm not afraid of it, which is the part that frightens me. She wants to know what it wants. I want it to want something back. We are two people on this ship who have looked at the same star for ten months, and neither of us has been able to stop looking.{% else %}I find I can't stop calculating it either, which is the part that frightens me. Every reading ends the same way: a thing with enough power to end the mission, sitting in her flight path, and no variable in the model for what it might do next. She keeps asking the chimp questions that have no answers. I keep answering them before she asks.{% endif %}
    {% else %}I shout back. No reason not to. And now I die again, because what's the point of staying up late? Whether or not this vast entity harbors real intelligence, our echo won't reach it for ten million corsecs — another ten, at the earliest, before we receive any reply. Might as well hit the crypt in the meantime. Shut down all desires and misgivings. Conserve whatever life I have left for moments that matter.

    I linger in the coffin, grateful for small and ancient victories. The chimp's dead, blackened eye gazes down from the ceiling; in all these millions of years nobody's scrubbed off the carbon scoring. It's a trophy from the early incendiary days of my Great Struggle. There's still something comforting about that blind, endless stare.

    I wash the rotten-egg stench from my hair and step into Eriophora's silent cathedral hallways. Sure enough the enemy waits in the darkness, turns the lights on as I approach, shuts them off behind me — but it does not break the silence. Not yet. The war has gone cold; I just go through the motions now, rattling my chains like an old married multiplet resigned to hating each other to the end of time. After all the moves and countermoves, the truth is I need each other.

    I treat myself to a gratuitous meal in the starbow commons. Three hours after coming back to life, I call up the forward feeds. DHF428 blinks at me from the center of the lounge: *Stop. Stop. Stop.* Maybe it's pure physiology. Maybe this endless cycle carries no more intelligence than the beating of a heart. But there's a pattern inside the pattern, some flicker in the blink. It makes my brain itch.

    {% if lean == 'heart' %}I find I'm not afraid of it, which is the part that frightens me. I want to know what it wants. I want it to want something back.{% else %}I find I can't stop calculating it, which is the part that frightens me. Every reading ends the same way: a thing with enough power to end the mission, sitting in my flight path, and no variable in the model for what it might do next.{% endif %}
    {% endif %}

    {% if perspective == 'pink' %}[Follow her down the corridor toward the library]({{ 'commons'|choice(log_found=0) }}){% else %}
