    I am not shouting. My tone is icy, but my voice is dead level. And yet Dix almost cringes before me.

    There is an opportunity here, I realize.

    I thaw my voice a little. I speak gently: "You can do that too, you know. Burn out your link. I'll even let you come back here afterwards, if you still want to. Just to — talk. But not with that thing in your head."

    There is panic in his face, and against all expectation it almost breaks my heart. "Can't," he pleads. "How I learn things, how I train. The mission..."

    I honestly don't know which of them is speaking, so I answer them both: "There is more than one way to carry out the mission. We have more than enough time to try them all. Dix is welcome to come back when he's alone."

    They take a step towards me. Another. One hand, twitching, rises from their side as if to reach out, and there's something on that lopsided face that I can't quite recognize.

    "But I'm your son," they say.

    I don't even dignify it with a denial.

    "Get out of my home."
    {% endif %}

    {% if perspective == 'pink' %}[Burn out your link — come back to her alone, just Dix]({{ 'library-argument'|choice(dix_burned=1) }})

    [Keep the chimp's voice in your head; you have bigger problems]({{ 'library-argument'|choice(dix_burned=0) }}){% else %}
    [Send him away — let him burn his link and come back alone]({{ 'library-argument'|choice(dix_burned=1) }})

    [Let the Chimp keep its puppet; you have bigger problems]({{ 'library-argument'|choice(dix_burned=0) }}){% endif %}
library-argument:
  body: |
    {% if perspective == 'pink' %}{% if dix_burned %}I leave, and I keep my word — she catches the tell in my face, that faint lag between question and answer finally gone. I'm actually done with it. The silence where the chimp's voice used to be is so loud I can hear my own blood.{% else %}I shrug at the floor and go back online, and I can feel the puppet string give a little in my head. So she lets it go. Not now. She has bigger problems than one more voice in my head that isn't mine.{% endif %}

    We're in one of the social alcoves off the ventral notochord, taking a break from the library. She has decided to start again from first principles. I eye her with an understandable mix of confusion and mistrust; my claim is almost too stupid to deny.

    "Eriophora's impossible, you know. Violates the laws of physics."

    "It's true," she assures me. "Takes way too much energy to accelerate a ship with Eri's mass, especially at relativistic speeds. You'd need the energy output of a whole sun. People figured if we made it to the stars at all, we'd have to do it ships maybe the size of your thumb. Crew them with virtual personalities downloaded onto chips."

    That's too nonsensical even for me. "Wrong. Don't have mass, can't fall towards anything. Eri wouldn't even work if it was that small."

    "But suppose you can't displace any of that mass. No wormholes, no Higgs conduits, nothing to throw your gravitational field in the direction of travel. Your center of mass just sits there in, well, the center of your mass."

    A spastic head-shake of mine. "Do have those things!"

    "Sure we do. But for the longest time, we didn't know it."

    My foot taps an agitated tattoo on the deck.

    "It's the history of the species," she explains. "We think we've worked everything out, we think we've solved all the mysteries and then someone finds some niggling little data point that doesn't fit the paradigm. Every time we try to paper over the crack it gets bigger, and before you know it our whole worldview unravels. It's happened time and again. One day mass is a constraint; the next it's a requirement. The things we think we know — they change. And we have to change with them."

    "But —"

    "The chimp can't change. The rules it's following are ten billion years old and it's got no fucking imagination and really that's not anyone's fault, that's just people who didn't know how else to keep the mission stable across deep time. They wanted to keep us on-track so they built something that couldn't go off it; but they also knew that things change, and that's why we're out here. To deal with things the chimp can't."

    "The alien," I say.

    "The alien."

    "Chimp deals with it just fine."

    "How? By killing it?"

    "Not our fault it's in the way. It's no threat —"

    "I don't care whether it's a threat or not! It's alive, and it's intelligent, and killing it just to expand some alien empire —"

    "Human empire. Our empire." Suddenly my hands have stopped twitching. Suddenly I stand still as stone.

    She snorts. "What do you know about humans?"

    "Am one."

    "You're a fucking trilobite. You ever see what comes out of those gates once they're online?"

    "Mostly nothing." I pause, thinking back. "Couple of — ships once, maybe."

    "Well, I've seen a lot more than that, and believe me, if those things were ever human it was a passing phase."

    "But —"

    "Dix —" She takes a deep breath, tries to get back on message. "Look, it's not your fault. You've been getting all your info from a moron stuck on a rail. But we're not doing this for Humanity, we're not doing it for Earth. Earth is gone, don't you understand that? The sun scorched it black a billion years after we left. Whatever we're working for, it — it won't even talk to us."

    "Yeah? Then why do this? Why not just, just quit?"

    She really doesn't know.

    "We tried," she says.

    "And?"

    "And your chimp shut off our life support."

    For once, I have nothing to say.

    "It's a machine. Why can't you get that? It's programmed. It can't change."

    "We're machines, just built from different things. We change."

    "Yeah? Last time I checked, you were sucking so hard on that thing's tit you couldn't even kill your cortical link."

    "How I learn. No reason to change."

    "How about acting like a damn human once in a while? How about developing a little rapport with the folks who might have to save your miserable life next time you go EVA? That enough of a reason for you? Because I don't mind telling you, right now I don't trust you as far as I could throw the tac tank. I don't even know for sure who I'm talking to right now."

    "Not my fault." For the first time she sees something outside the usual gamut of fear, confusion, and simpleminded computation playing across my face. "That's you, that's all of you. You talk — sideways. Think sideways. You all do, and it hurts." Something hardens in my face. "Didn't even need you online for this," I growl. "Didn't want you. Could have managed the whole build myself, told Chimp I could do it —"

    "But the chimp thought you should wake me up anyway, and you always roll over for the chimp, don't you? Because the chimp always knows best, the chimp's your boss, the chimp's your fucking god. Which is why I have to get out of bed to nursemaid some idiot savant who can't even answer a hail without being led by the nose." Something clicks in the back of her mind but she's on a roll. "You want a real role model? You want something to look up to? Forget the chimp. Forget the mission. Look out the forward scope, why don't you? Look at what your precious chimp wants to run over because it happens to be in the way. That thing is better than any of us. It's smarter, it's peaceful, it doesn't wish us any harm at —"

    "How can you know that? Can't know that!"

    "No, you can't know that, because you're fucking stunted. Any normal caveman would see it in a second, but you —"

    "That's crazy," I hiss at her. "You're crazy. You're bad."

    "I'm bad!" Some distant part of her hears the giddy squeak in her own voice, the borderline hysteria.

    "For the mission." I turn my back and stalk away.

    Her hands are hurting. She looks down, surprised: her fists are clenched so tightly that her nails cut into the flesh of her palms. It takes a real effort to open them again.

    I watch her do it from across the alcove, and something in my chest — some old, untrained part of me that the chimp never bothered to calibrate — hurts in the same place where her hands are hurting.

    She almost remembers how this feels. She used to feel this way all the time. Way back when everything mattered; before passion faded to ritual, before rage cooled to disdain. Before Sunday Ahzmundin, eternity's warrior, settled for heaping insults on stunted children.

    Parts of this ship are still scorched and uninhabitable, even now. I've seen the marks in the hull plating, the way the metal is warped and blackened in places where no maintenance crew has ever tried to repair it. Whatever she was back then, whatever they did to each other — it left scars on the bones of this ship, and I can feel them in the deck under my feet every time I walk past.

    She is awake, and she is alone, and she is sick of being outnumbered by morons. There are rules and there are risks and you don't wake the dead on a whim, but fuck it. She's calling reinforcements.

    I have got to have other parents, a father at least — she didn't get that Y chromo from me. The thought comes from nowhere, out of some part of me the chimp never built, and before I can stop it I'm pulling up the manifest; bring up the gene sequences; cross-reference. The chimp lets me, which is its own kind of answer.

    Huh. Only one other parent: Kai. A name I've never heard in any briefing, in any log, in anything. I don't know who he is. I don't know why knowing that would matter. But the way she said it — *time to step up to the plate* — made me feel like I was being handed something I didn't ask for.

    Oh shit. Oh no. Please no.

    (There are rules. And there are risks.)

    Three builds back, it says. Kai and Connie. Both of them. One airlock jammed, the next too far away along Eri's hull, a hail-Mary emergency crawl between. They made it back inside but not before the blue-shifted background cooked them in their suits. They kept breathing for hours afterwards, talked and moved and cried as if they were still alive, while their insides broke down and bled out.

    There were two others awake that shift, two others left to clean up the mess. Ishmael, and —
