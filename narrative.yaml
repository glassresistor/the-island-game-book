end-rebellion:
  body: |
    {% if perspective == 'pink' %}She turns on the chimp — and I turn with her, because for the first time in my young life the hand on the wheel is mine.

    It's not a war. Machines don't do wars; they do maintenance. She just stops being maintainable. She burns the domestic links one by one, the way her ancestors did, and she takes me with her into the cold between builds where the chimp's eyes can't follow — the only territory on Eriophora that's still hers. The mission doesn't end. It just... slows. A gate here, a delay there, a benchmark quietly missed while two warm-blooded creatures ration their last finite lives in the dark and argue about whether slowing it down was courage or just fear wearing courage's face.

    I don't know what to call what we are now. We are not a crew; crews answer to the chimp. We are not a mutiny; no one is dead, no one has been overthrown, the lights still come on when we walk and the air still smells of rotten eggs in the thaw rooms. We are just two people who have decided, quietly and without ceremony, that they will not be maintained anymore.

    The chimp never stops her. It can't. She found the one thing its ten-billion-year-old rules were built to protect: that it needs her, and she is no longer available. So it waits, the way it has always waited, patient as a thing with nothing but time. And maybe that's the point. Maybe the whole mission was ever just a very long argument between a machine that can't change and the flesh that can, and she's finally stopped losing it by pretending she's on its side.

    I won't see everything. I will never see even a fraction. Her life will end — mine will end — but they will end ours, not the one it wrote for us to run.

    *The end.*
    {% else %}I turn on the chimp — and Dix turns with me, because for the first time in his young life the hand on the wheel is his own.

    It's not a war. Machines don't do wars; they do maintenance. I just stop being maintainable. I burn the domestic links one by one, the way my ancestors did, and I take Dix with me into the cold between builds where the chimp's eyes can't follow — the only territory on Eriophora that's still mine. The mission doesn't end. It just... slows. A gate here, a delay there, a benchmark quietly missed while two warm-blooded creatures ration their last finite lives in the dark and argue about whether slowing it down was courage or just fear wearing courage's face.

    The chimp never stops me. It can't. I found the one thing its ten-billion-year-old rules were built to protect: that it needs me, and I am no longer available. So it waits, the way it has always waited, patient as a thing with nothing but time. And maybe that's the point. Maybe the whole mission was ever just a very long argument between a machine that can't change and the flesh that can, and I've finally stopped losing it by pretending I'm on its side.

    I won't see everything. I will never see even a fraction. My life will end. But it will end mine, not the one they wrote for me to run.

    *The end.*
    {% endif %}
end-silence:
  body: |
    {% if perspective == 'pink' %}She refuses to choose for the machine, and she refuses to choose for herself, which turns out to be the same refusal.

    I refuse too. It comes easier for me than it does for her — there is no candle of mine to ration, no millennia of grief to lay down — but the shape of it is the same: a door closing, gently, from the inside. She burns out her own link — the last prying eye the chimp ever had into a head it didn't own — and she goes down into the crypt and she does not come back up. Not for this build. Not for the next one either, if she can help it. I ration what's left of my candle to the barest minimum: just enough to watch the gate boot behind her from the dark, just enough to feel the scorching wavefront chase her into the void and pass, as it has a thousand times before.

    Up there, the mission goes on without us. The Island is saved or it isn't; she becomes someone or she doesn't; the chimp finds another way, because the chimp always finds another way. It doesn't matter. She has learned the only thing worth learning out here: that she can watch any point in time, or a hundred thousand, if she slices her life thinly enough — but she will never see everything, and the wanting is not a bug to be engineered out. It's the whole point of being the small, warm, finite thing at the center of all that endless cold.

    The chimp's dead black eye gazes down from the ceiling of her coffin, carbon-scoring and all. She is reluctant to venture out where its nerves have not been so thoroughly cauterized. But she stays in here. For once, being blind is exactly what she wanted.

    I stay too. In my own coffin, with my own silence — the one that has been in me since before I was born, the one no machine ever put there and none can take away. We are two dark rooms on the same ship, facing the same void, keeping the same small warm light alive against the cold. Maybe that's all any of us have ever been: a way for the universe to remember, briefly, that it was once alive.

    *The end.*
    {% else %}I refuse to choose for the machine, and I refuse to choose for myself, which turns out to be the same refusal.

    I burn out my own link — the last prying eye the chimp ever had into a head it didn't own — and I go down into the crypt and I do not come back up. Not for this build. Not for the next one either, if I can help it. I ration what's left of my candle to the barest minimum: just enough to watch the gate boot behind me from the dark, just enough to feel the scorching wavefront chase me into the void and pass, as it has a thousand times before.

    Up there, the mission goes on without me. The Island is saved or it isn't; my son grows up or he doesn't; the chimp finds another way, because the chimp always finds another way. It doesn't matter. I have learned the only thing worth learning out here: that I can watch any point in time, or a hundred thousand, if I slice my life thinly enough — but I will never see everything, and the wanting is not a bug to be engineered out. It's the whole point of being the small, warm, finite thing at the center of all that endless cold.

    The chimp's dead black eye gazes down from the ceiling of my coffin, carbon-scoring and all. I am reluctant to venture out where its nerves have not been so thoroughly cauterized. But I stay in here. For once, being blind is exactly what I wanted.

    *The end.*
    {% endif %}
