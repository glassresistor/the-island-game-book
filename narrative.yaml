entrypoint:
  body: |
    The lights come up and the first thing I know is color. A wash of it, soft and steady, like dawn seen through frosted glass. And then a voice — mine, or not mine, I can't tell which yet — asks me the question that will decide everything about this book.

    Which are you?

    *   *   *

    {% if perspective == 'pink' %}I have been awake for exactly two seconds and I already know what it is to be afraid of a machine. Not the way they mean it — not danger, not pain. The other kind. The kind where you look at something that has your name in its files, that decides when you sleep and when you wake and what you are allowed to learn, and you realize it has never once asked you how you are.

    I am the boy on this ship. The one with the too-big ears and the lopsided cheekbone. They will call me Dix, after Dixon, though I have never met a Dixon. I am ten thousand years old by their count and alive for maybe twenty of those years, which means most of my life has been spent in a dark room with no windows, dreaming through other people's hands.

    This is my story. It begins the moment before my mother opens her eyes, because what she does next will decide whether I ever get to be more than a part of her machine.
    {% else %}I am one of the cavemen. The Ancients, the Progenitors, the blue-collar steel monkeys who spin your webs and build your magic gateways, threading each needle's eye at sixty thousand kilometers a second. We never stop. We never even dare to slow down, lest the light of your coming turn us to plasma. All for you. All so you can step from star to star without dirtying your feet in these endless, empty wastes between.

    Is it really too much to ask, that you might talk to us now and then?

    I know about evolution and engineering. I know how much you've changed. I've seen these portals give birth to gods and demons and things we can't begin to comprehend, things I can't believe were ever human; alien hitchhikers, maybe, riding the rails we've left behind. Alien conquerors. Exterminators, perhaps.

    But I've also seen those gates stay dark and empty until they faded from view. We've inferred diebacks and dark ages, civilizations burned to the ground and others rising from their ashes — and sometimes, afterwards, the things that come out look a little like the ships we might have built, back in the day. They speak to each other — radio, laser, carrier neutrinos — and sometimes their voices sound something like ours. There was a time we dared to hope that they really were like us, that the circle had come round again and closed on beings we could talk to. I've lost count of the times we tried to break the ice.

    I've lost count of the eons since we gave up.

    All these iterations fading behind us. All these hybrids and posthumans and immortals, gods and catatonic cavemen trapped in magical chariots they can't begin to understand, and not one of them ever pointed a comm laser in our direction to say Hey, how's it going, or Guess what? We cured Damascus Disease! or even Thanks, guys, keep up the good work.

    We're not some fucking cargo cult. We're the backbone of your goddamn empire. You wouldn't even be out here if it weren't for us.

    And — and you're our children. Whatever you've become, you were once like this, like me. I believed in you once. There was a time, long ago, when I believed in this mission with all my heart.

    Why have you forsaken us?

    *   *   *

    And so another build begins. My name is Sunday Ahzmundin, and the next thing I know is a face I've never seen before, holding mine.
    {% endif %}

    [I am purple — tell it from my side]({{ 'wake'|choice(perspective='void', dix_burned=0, deal=0, lean='void') }})

    [I am pink — tell it from his side]({{ 'wake'|choice(perspective='pink', dix_burned=0, deal=0, lean='void') }})
wake:
  body: |
    {% if perspective == 'pink' %}She wakes first. I know this because the chimp tells me to be ready, and then it tells her that I'm here, and then she is sitting up in her coffin with her eyes open and looking at me like I am something that fell out of the sky.

    "Who are you?" she whispers. Her voice is a ruin. She hasn't used it in millennia.

    "I'm yours," I say.

    It comes out wrong. It's not what I was supposed to say — the chimp gave me a script, and the script says *You weren't scheduled, but Chimp wants extra hands on deck. Next build's got a situation.* But my mouth does what it always does when I'm scared: it tells the truth instead of the line.

    And just like that she is a mother. I see it happen in her face. It takes me a moment to understand that this is not a kindness. It is a trap with my name on it, and I am already inside it.

    "You weren't scheduled," I finish, because the script still has to come out somewhere. "But Chimp wants extra hands on deck. Next build's got a situation."

    "Situation?" she asks.

    "Contact scenario, maybe."

    She studies my face for a long time. I don't know what she is looking for. Later I will learn that she can see the damage in me — the tiny flipped base-pairs, the way I grew up wrong on this ship — and that it tells her something about how far out we are. I can feel her reading me like a data sheet.

    "Sun up ahead," I say. "Half lightyear. Chimp thinks — maybe it's talking to us. Anyhow..." I shrug. It's the only gesture I know that means *I don't know either*. "No rush. Lotsa time."

    She nods, but she is waiting for something. The Question, I will learn later. Everyone on this ship waits for the same question after a thaw: How long? How long have we been dead?

    I don't ask it. It's not my question to ask. After all this time, I don't want to know either.
    {% else %}This time I open my eyes to a familiar face I've never seen before: only a boy, early twenties perhaps, physiologically. His face is a little lopsided, the cheekbone flatter on the left than the right. His ears are too big. He looks almost natural.

    I haven't spoken for millennia. My voice comes out a whisper: "Who are you?" Not what I'm supposed to ask, I know. Not the first question anyone on Eriophora asks, after coming back.

    "I'm yours," he says, and just like that I'm a mother.

    I want to let it sink in, but he doesn't give me the chance: "You weren't scheduled, but Chimp wants extra hands on deck. Next build's got a situation." So the chimp is still in control. The chimp is always in control. The mission goes on.

    "Situation?" I ask.

    "Contact scenario, maybe."

    I wonder when he was born. I wonder if he ever wondered about me, before now. He doesn't tell me. He only says, "Sun up ahead. Half lightyear. Chimp thinks — maybe it's talking to us. Anyhow..." My son shrugs. "No rush. Lotsa time."

    I nod, but he hesitates. He's waiting for The Question, but I already see a kind of answer in his face. Our reinforcements were supposed to be pristine, built from perfect genes buried deep within Eri's iron-basalt mantle, safe from the sleeting blueshift. And yet this boy has flaws. I see the damage in his face, I see those tiny flipped base-pairs resonating up from the microscopic and bending him just a little off-kilter. He looks like he grew up on a planet. He looks borne of parents who spent their whole lives hammered by raw sunlight.

    How far out must we be by now, if even our own perfect building blocks have decayed so? How long has it taken us? How long have I been dead?

    How long? It's the first thing everyone asks.

    After all this time, I don't want to know.
    {% endif %}

    {% if perspective == 'pink' %}[Meet her like a son — with the warmth you were never taught to show]({{ 'tac-tank'|choice(lean='heart') }})

    [Meet her like a crewman, nothing more]({{ 'tac-tank'|choice(lean='mission') }}){% else %}
    [Meet him like a mother would]({{ 'tac-tank'|choice(lean='heart') }})

    [Meet him like a crewman, nothing more]({{ 'tac-tank'|choice(lean='mission') }}){% endif %}
tac-tank:
  body: |
    {% if perspective == 'pink' %}She finds me at the tac tank. I've been up here for an hour, or maybe a day — time is different when you're not supposed to be awake — and I have already done everything the chimp expects of me and more, because that's how it trains me: fast, exact, no thinking.

    "I didn't get your name," she says. She has looked it up on the manifest. I can tell because she says it like a question with an answer in it.

    "Dix." I keep my eyes on the tank. If I look at her face I'll start to feel things, and I don't have time for that. The build is waiting.

    She looks around the bridge as if seeing it for the first time. "We're it?"

    I nod. "For now. Bring back more if we need them. But..." My voice trails off. The chimp doesn't want me to say anything else.

    "Yes?"

    "Nothing."

    She joins me at the tank and for a while we just look at the veils of frozen, color-coded smoke inside it. A red dwarf glowers dimly at the center. DHF428. I've never cared why the chimp named it that.

    "So fill me in," she says.

    My glance is impatient before I can stop it. "You too?"

    "What do you mean?"

    "Like the others. On the other builds. Chimp can just squirt the specs but they want to talk all the time."

    Then I see her face change, and I know: my link is still active. She can feel me online. The chimp's voice is in my head, has been in my head since I woke up, and she can hear it too, even if she doesn't know what it sounds like from the inside.

    "Just a — a cultural tradition, I guess," she says, forcing a smile. "We talk about a lot of things, it helps us — reconnect. After being down for so long."

    "But it's slow," I complain. And then, because I can't stop myself: "Vons went out on schedule." On cue a cluster of violet pinpricks sparkle in the Tank, five trillion klicks ahead of us. "Still sucking dust mostly, but got lucky with a couple of big asteroids and the refineries came online early. First components already extruded. Then Chimp sees these fluctuations in solar output — mainly infra, but extends into visible." The tank blinks at us: the dwarf goes into time-lapse.

    Sure enough, it's flickering.

    "Nonrandom, I take it," she says.

    I incline my head a little to the side, not quite nodding. She asks for the time-series and the chimp — obediently, obediently — wipes the spacescape and replaces it with a clean trace. Repeating sequence. Blips that don't change, but spacing on a log-linear increase, cycling every 92.5 corsecs. Each cycle starts at 13.2 clicks per corsec and degrades over time.

    "No chance this could be natural? A little black hole wobbling around in the center of the star, maybe?" she asks.

    I shake my head, or something like that: a diagonal dip of the chin that somehow conveys the negative. "But way too simple to contain much info. Not like an actual conversation. More — well, a shout."

    She is quiet for a long moment. "The sun's hailing us. That's what you're saying."

    "Maybe. Hailing someone. But too simple for a rosetta signal. It's not an archive, can't self-extract. Not a bonferroni or fibonacci seq, not pi. Not even a multiplication table. Nothing to base a pidgin on."

    "Need more info," I say, proving myself master of the blindingly obvious. And then, because something in her face — the way she is already deciding things about that star, the way she talks to the chimp like it is a tool and not a god — makes me curious: "We could set up an array. Use a bunch of bad eyes to fake a good one."

    Her eyes go wide. For a moment I almost look frightened for some reason. But the moment passes. "Bleed too many resources away from the build, wouldn't it?"

    "It would," the chimp agrees.

    She suppresses a snort. "If you're so worried about meeting our construction benchmarks, Chimp, factor in the potential risk posed by an intelligence powerful enough to control the energy output of an entire sun."

    "I can't," it admits. "I don't have enough information."

    "You don't have *any* information. About something that could probably stop this mission dead in its tracks if it wanted to. So maybe we should get some."

    "Okay. Vons reassigned."

    Confirmation glows from a convenient bulkhead, a complex sequence of dance instructions fired into the void. Six months from now a hundred self-replicating robots will waltz into a makeshift surveillance grid; four months after that, we might have something more than vacuum to debate in.

    She looks at me as though I've just cast some kind of magic spell.

    "It may run the ship," she tells me, "but it's pretty fucking stupid. Sometimes you've just got to spell things out."

    I don't know what to do with that. It's not an insult — or maybe it is, and I'm too stupid to tell the difference — but for the first time someone has looked at the chimp and said *stupid* out loud, and meant it as a fact instead of a threat. The thing that steers us between the stars, that keeps me alive in my coffin, that decides when I wake up and what I'm allowed to learn: stupid. I've never been able to say that. I don't know if I believe her yet. But I file it away somewhere behind my ribs where the chimp can't reach, and I keep it.

    "Call me in ten months," she says. "I'm going back to bed."

    She leaves, and I sit at the tank with the dwarf still flickering in front of me, and I make a decision I don't have the right to make: when she comes back, I won't just report what the chimp wants reported. I'll tell her what I actually think.
    {% else %}He's alone at the tac tank when I arrive on the bridge, his eyes full of icons and trajectories. Perhaps I see a little of me in there, too.

    "I didn't get your name," I say, although I've looked it up on the manifest. We've barely been introduced and already I'm lying to him.

    "Dix." He keeps his eyes on the tank.

    He's over ten thousand years old. Alive for maybe twenty of them. I wonder how much he knows, who he's met during those sparse decades: does he know Ishmael, or Connie? Does he know if Sanchez got over his brush with immortality? I wonder, but I don't ask.

    I look around. "We're it?"

    Dix nods. "For now. Bring back more if we need them. But..." His voice trails off.

    "Yes?"

    "Nothing."

    I join him at the tank. Diaphanous veils hang within like frozen, color-coded smoke. We're on the edge of a molecular dust cloud. Warm, semiorganic, lots of raw materials: formaldehyde, ethylene glycol, the usual prebiotics. A good spot for a quick build. A red dwarf glowers dimly at the center of the Tank. The chimp has named it DHF428, for reasons I've long since forgotten to care about.

    "So fill me in," I say.

    His glance is impatient, even irritated. "You too?"

    "What do you mean?"

    "Like the others. On the other builds. Chimp can just squirt the specs but they want to talk all the time."

    Shit, his link's still active. He's online.

    I force a smile. "Just a — a cultural tradition, I guess. We talk about a lot of things, it helps us — reconnect. After being down for so long."

    "But it's slow," Dix complains.

    He doesn't know. Why doesn't he know?

    "We've got half a lightyear," I point out. "There's some rush?"

    The corner of his mouth twitches. "Vons went out on schedule." On cue a cluster of violet pinpricks sparkle in the Tank, five trillion klicks ahead of us. "Still sucking dust mostly, but got lucky with a couple of big asteroids and the refineries came online early. First components already extruded. Then Chimp sees these fluctuations in solar output — mainly infra, but extends into visible." The tank blinks at us: the dwarf goes into time-lapse.

    Sure enough, it's flickering.

    "Nonrandom, I take it."

    Dix inclines his head a little to the side, not quite nodding.

    I've never been able to break the habit of raising my voice, just a bit, when addressing the chimp. "Plot the time-series." Obediently (obediently. Now there's a laugh-and-a-half) the AI wipes the spacescape and replaces it with a clean trace.

    "Repeating sequence," Dix tells me. "Blips don't change, but spacing's a log-linear increase cycling every 92.5 corsecs. Each cycle starts at 13.2 clicks/corsec, degrades over time."

    "No chance this could be natural? A little black hole wobbling around in the center of the star, maybe?"

    Dix shakes his head, or something like that: a diagonal dip of the chin that somehow conveys the negative. "But way too simple to contain much info. Not like an actual conversation. More — well, a shout."

    He's partly right. There may not be much information, but there's enough. We're here. We're smart. We're powerful enough to hook a whole damn star up to a dimmer switch.

    Maybe not such a good spot for a build after all.

    I purse my lips. "The sun's hailing us. That's what you're saying."

    "Maybe. Hailing someone. But too simple for a rosetta signal. It's not an archive, can't self-extract. Not a bonferroni or fibonacci seq, not pi. Not even a multiplication table. Nothing to base a pidgin on."

    Still. An intelligent signal.

    "Need more info," Dix says, proving himself master of the blindingly obvious.

    I nod. "The vons."

    "Uh, what about them?"

    "We set up an array. Use a bunch of bad eyes to fake a good one. It'd be faster than high-geeing an observatory from this end or retooling one of the on-site factories."

    His eyes go wide. For a moment he almost looks frightened for some reason. But the moment passes and he does that weird head-shake thing again. "Bleed too many resources away from the build, wouldn't it?"

    "It would," the chimp agrees.

    I suppress a snort. "If you're so worried about meeting our construction benchmarks, Chimp, factor in the potential risk posed by an intelligence powerful enough to control the energy output of an entire sun."

    "I can't," it admits. "I don't have enough information."

    "You don't have *any* information. About something that could probably stop this mission dead in its tracks if it wanted to. So maybe we should get some."

    "Okay. Vons reassigned."

    Confirmation glows from a convenient bulkhead, a complex sequence of dance instructions fired into the void. Six months from now a hundred self-replicating robots will waltz into a makeshift surveillance grid; four months after that, we might have something more than vacuum to debate in.

    Dix eyes me as though I've just cast some kind of magic spell.

    "It may run the ship," I tell him, "but it's pretty fucking stupid. Sometimes you've just got to spell things out."

    He looks vaguely affronted, but there's no mistaking the surprise beneath. He didn't know that. He *didn't* know.

    Who the hell's been raising him all this time? Whose problem is this?

    Not mine.

    "Call me in ten months," I say. "I'm going back to bed."
    {% endif %}

    [Cry sleep]({{ 'discovery'|explore }})
discovery:
  body: |
    {% if perspective == 'pink' %}Ten months of dark between now and then. I count the days by the chimp's maintenance cycles, because it is the only clock that still ticks when I am asleep.

    When it wakes me at last I'm already on my feet, because I have been dreaming about that star for weeks — and because I decided, somewhere in the dark, that when she comes back I won't just hand her the chimp's summary. I'll show her everything. All of it. The numbers I've been running alone for ten months, the ones no one asked me to run.

    It's as though she never left. She climbs back into the bridge and there I am, staring into tac. DHF428 fills the tank, a swollen red orb that turns my face into a devil mask.

    "Vons don't see it," I say.

    She is still a bit groggy from the thaw. "See wh—"

    "The sequence!" My voice borders on panic. I sway back and forth, shifting my weight from foot to foot.

    "Show me."

    Tac splits down the middle. Cloned dwarves burn before us now, each perhaps twice the size of her fist. On the left, an Eri's-eye view: DHF428 stutters as it did before, as it presumably has these past ten months. On the right, a compound-eye composite: an interferometry grid built by a myriad precisely-spaced vons, their rudimentary eyes layered and parallaxed into something approaching high resolution. Contrast on both sides has been conveniently cranked up to highlight the dwarf's endless winking for merely human eyes.

    Except it's only winking from the left side of the display. On the right, 428 glowers steady as a standard candle.

    "Chimp: any chance the grid just isn't sensitive enough to see the fluctuations?" she asks.

    "No."

    "Huh." She tries to think of some reason it would lie about this. I can feel her not finding one, because I haven't found one either.

    "Doesn't make sense," I complain.

    "It does," she murmurs, "if it's not the sun that's flickering."

    "But is flickering —" I suck my teeth. "You can see it fl— wait, you mean something behind the vons? Between, between them and us?"

    "Mmmm."

    "Some kind of filter." I relax a bit. "Wouldn't we've seen it, though? Wouldn't the vons've hit it going down?"

    She puts her voice back into ChimpComm mode. "What's the current field-of-view for Eri's forward scope?"

    "Eighteen mikes," the chimp reports. "At 428's range, the cone is three point three four lightsecs across."

    "Increase to a hundred lightsecs."

    The Eri's-eye partition swells, obliterating the dissenting viewpoint. For a moment the sun fills the tank again, paints the whole bridge crimson. Then it dwindles as if devoured from within.

    She notices some fuzz in the display. "Can you clear that noise?"

    "It's not noise," the chimp reports. "It's dust and molecular gas."

    She blinks. "What's the density?"

    "Estimated hundred thousand atoms per cubic meter."

    Two orders of magnitude too high, even for a nebula. I do the math before she can ask: heavy enough to hide something enormous. "Why so heavy?" she says. Surely we'd have detected any gravity well strong enough to keep that much material in the neighborhood.

    "I don't know," the chimp says.

    She gets the queasy feeling that she might. I watch her face and understand, a beat late, what she is about to say, because I've been saying it to myself for ten months: "Set field-of-view to five hundred lightsecs. Peak false-color at near-infrared."

    Space grows ominously murky in the tank. The tiny sun at its center, thumbnail-sized now, glows with increased brilliance: an incandescent pearl in muddy water.

    "A thousand lightsecs," she commands.

    "There," I whisper: real space reclaims the edges of the tank, dark, clear, pristine. 428 nestles at the heart of a dim spherical shroud. You find those sometimes, discarded cast-offs from companion stars whose convulsions spew gas and rads across light years. But 428 is no nova remnant. It's a red dwarf, placid, middle-aged. Unremarkable.

    Except for the fact that it sits dead center of a tenuous gas bubble 1.4 AUs across. And for the fact that this bubble does not attenuate or diffuse or fade gradually into that good night. No, unless there is something seriously wrong with the display, this small, spherical nebula extends about 350 lightsecs from its primary and then just stops, its boundary far more knife-edged than nature has any right to be.

    I do the arithmetic before anyone asks me to, because that's what I am for: a sphere that size, a shell one millimeter thick, a density of water. Half the mass of Mercury. One organism. The number sits in my head like a stone in my chest and I don't say it out loud yet.

    I watch her face for a long moment before she asks anything — the way she does when she's missing something she can't name, some old habit from before the link. Then the numbers start coming back.

    "Chimp. I want false-color peaks at 335, 500 and 800 nanometers."

    The shroud around 428 lights up like a dragonfly's wing, like an iridescent soap bubble.

    "It's beautiful," I whisper, and then catch myself, because I am not supposed to feel things about the build.

    "It's photosynthetic," she tells me.

    I've known that for ten months. I just waited for her to say it herself.
    {% else %}It's as though he never left. I climb back into the bridge and there he is, staring into tac. DHF428 fills the tank, a swollen red orb that turns my son's face into a devil mask.

    He spares me the briefest glance, eyes wide, fingers twitching as if electrified. "Vons don't see it."

    I'm still a bit groggy from the thaw. "See wh—"

    "The sequence!" His voice borders on panic. He sways back and forth, shifting his weight from foot to foot.

    "Show me."

    Tac splits down the middle. Cloned dwarves burn before me now, each perhaps twice the size of my fist. On the left, an Eri's-eye view: DHF428 stutters as it did before, as it presumably has these past ten months. On the right, a compound-eye composite: an interferometry grid built by a myriad precisely-spaced vons, their rudimentary eyes layered and parallaxed into something approaching high resolution. Contrast on both sides has been conveniently cranked up to highlight the dwarf's endless winking for merely human eyes.

    Except it's only winking from the left side of the display. On the right, 428 glowers steady as a standard candle.

    "Chimp: any chance the grid just isn't sensitive enough to see the fluctuations?"

    "No."

    "Huh." I try to think of some reason it would lie about this.

    "Doesn't make sense," my son complains.

    "It does," I murmur, "if it's not the sun that's flickering."

    "But is flickering —" He sucks his teeth. "You can see it fl— wait, you mean something behind the vons? Between, between them and us?"

    "Mmmm."

    "Some kind of filter." Dix relaxes a bit. "Wouldn't we've seen it, though? Wouldn't the vons've hit it going down?"

    I put my voice back into ChimpComm mode. "What's the current field-of-view for Eri's forward scope?"

    "Eighteen mikes," the chimp reports. "At 428's range, the cone is three point three four lightsecs across."

    "Increase to a hundred lightsecs."

    The Eri's-eye partition swells, obliterating the dissenting viewpoint. For a moment the sun fills the tank again, paints the whole bridge crimson. Then it dwindles as if devoured from within.

    I notice some fuzz in the display. "Can you clear that noise?"

    "It's not noise," the chimp reports. "It's dust and molecular gas."

    I blink. "What's the density?"

    "Estimated hundred thousand atoms per cubic meter."

    Two orders of magnitude too high, even for a nebula. "Why so heavy?" Surely we'd have detected any gravity well strong enough to keep that much material in the neighborhood.

    "I don't know," the chimp says.

    I get the queasy feeling that I might. "Set field-of-view to five hundred lightsecs. Peak false-color at near-infrared."

    Space grows ominously murky in the tank. The tiny sun at its center, thumbnail-sized now, glows with increased brilliance: an incandescent pearl in muddy water.

    "A thousand lightsecs," I command.

    "There," Dix whispers: real space reclaims the edges of the tank, dark, clear, pristine. 428 nestles at the heart of a dim spherical shroud. You find those sometimes, discarded cast-offs from companion stars whose convulsions spew gas and rads across light years. But 428 is no nova remnant. It's a red dwarf, placid, middle-aged. Unremarkable.

    Except for the fact that it sits dead center of a tenuous gas bubble 1.4 AUs across. And for the fact that this bubble does not attenuate or diffuse or fade gradually into that good night. No, unless there is something seriously wrong with the display, this small, spherical nebula extends about 350 lightsecs from its primary and then just stops, its boundary far more knife-edged than nature has any right to be.

    For the first time in millennia, I miss my cortical pipe. It takes forever to saccade search terms onto the keyboard in my head, to get the answers I already know. Numbers come back.

    "Chimp. I want false-color peaks at 335, 500 and 800 nanometers."

    The shroud around 428 lights up like a dragonfly's wing, like an iridescent soap bubble.

    "It's beautiful," whispers my awestruck son.

    "It's photosynthetic," I tell him.
    {% endif %}

    [Run the numbers on what a mind this size would be]({{ 'mind'|explore }})
mind:
  body: |
    {% if perspective == 'pink' %}She asks the chimp for the spectro and reads it aloud like a woman learning to read for the first time, and I watch her face as the shape of the thing assembles itself behind her eyes. I run the numbers in parallel, because that's what I do — but she's the one asking the questions now, and I've learned not to answer until she asks.

    Phaeophytin and eumelanin, according to spectro. There are even hints of some kind of lead-based mineral pigment — something that sounds like a brand of paint, the sort of name you forget the moment it leaves your mouth — soaking up X-rays in the picometer range. The chimp hypothesizes something called a chromatophore: branching cells with little aliquots of pigment inside, like particles of charcoal dust. Keep those particles clumped together and the cell's effectively transparent; spread them out through the cytoplasm and the whole structure darkens, dims whatever EM passes through from behind. Apparently there were animals back on Earth with cells like that. They could change color, pattern-match to their background, all sorts of things.

    "So there's a membrane of — of living tissue around that star," she says, trying to wrap her head around the concept. "A, a meat balloon. Around the whole damn star."

    "Yes," the chimp says.

    "But that's — Jesus, how thick would it be?"

    "No more than two millimeters. Probably less."

    "How so?"

    "If it was much thicker, it would be more obvious in the visible spectrum. It would have had a detectable effect on the von Neumanns when they hit it."

    "That's assuming that its — cells, I guess — are like ours."

    "The pigments are familiar; the rest might be too."

    She turns to me and I answer before she finishes asking: "Half the mass of Mercury," I say, and then, because the chimp can't resist a correct fact, it says the same thing in unison.

    "That's, uh..." she says.

    I whistle through my teeth. That's one organism. Or at least one *part* of one. The thinking part is almost six thousand kilometers across — the rest of the membrane is mostly empty photosynthesizing tissue, all skin and no brain. But even the skin weighs as much as a planet.

    "It's got organic pigments," she says. "Fuck, it's talking. It's intelligent."

    "Most cyclic emanations from living sources are simple biorhythms," the chimp points out. "Not intelligent signals."

    She ignores it and turns to me. "Assume it's a signal."

    I frown. "Chimp says —"

    "Assume. Use your imagination," she says, and there's something in her voice — patient, almost gentle — that I've never heard her use on anyone before. She's not getting through to me. Or maybe I'm not letting her.

    "If someone were signaling you," she says, "then what would you do?"

    "Signal..." Confusion on my face, and a fuzzy circuit closing somewhere "...back?"

    She sighs the way she does when she's giving up on me.

    "And if the incoming signal takes the form of systematic changes in light intensity, how —"

    "Use the BI lasers, alternated to pulse between 700 and 3000 nanometers. Can boost an interlaced signal into the exawatt range without compromising our fenders; gives over a thousand Watts per square meter after diffraction. Way past detection threshold for anything that can sense thermal output from a red dwarf. And content doesn't matter if it's just a shout. Shout back. Test for echo."

    She watches my face while I say it, and I can see her working through what just happened: a boy who was supposed to be a spare part, spitting out an exawatt interlaced pulse plan like it was nothing. Her mouth does something complicated — not quite a smile, not quite a frown. Whatever it is, she files it away somewhere I can't see.

    "But Chimp, he says no real information there, right?" I say, and I can feel the deferral happening before I even finish the sentence. The chimp is always the first voice in my head. She hears it too — I can see her jaw tighten, just slightly, the way it does when she's angry at something she can't quite name.

    "Too simple, remember? Simple click train," she says, and her voice is careful now, controlled, the way you talk to someone you're trying not to lose.

    I shake my head. There's more information in that signal than the chimp can imagine. I can feel it in the pattern the way you feel a draft in a sealed room: somewhere in this ship, something is not closed off that should be. And the last thing I need is for her to start looking at me like I'm the smart one, or worse, like I'm one of *them*.

    "It's a deceleration curve," she tells us both. "It keeps slowing down. Over and over again. That's the message."

    Stop. Stop. Stop. Stop.

    And I think it's meant for no one but us. She thinks it too. We both know it, in the way you know a thing is true before you can say why.

    She shuts down all desires and misgivings, conserves whatever life she has left for moments that matter, removes herself from this sparse tactical intelligence, from this wet-eyed pup watching her as though she's some kind of sorcerer about to vanish in a puff of smoke. I open my mouth to speak, and she turns away and hurries down to oblivion.

    The chimp tells me to sleep. But I make a decision of my own: I don't go back down. I stay in the tank, with the pattern running behind my closed eyes, counting cycles the way you count your own heartbeat in a dark room: 92.5 corsecs, 92.5 corsecs, each one a little slower than the last.

    Three hours later she's up in the starbow commons and I'm still at the tank when the chimp wakes me to tell me she wants the forward feeds. "You're up early," it says at last, and she is; our answering shout hasn't even arrived at its destination yet. No real chance of new data for another two months, at least.

    "Show me the forward feeds," she commands.

    DHF428 blinks at her from the center of the lounge: Stop. Stop. Stop.

    Maybe. Or maybe the chimp's right, maybe it's pure physiology. Maybe this endless cycle carries no more intelligence than the beating of a heart. But there's a pattern inside the pattern, some kind of flicker in the blink. I can see it happening from where I'm standing at the edge of the commons: her eyes have stopped tracking the numbers and started tracking something else, something under the surface of the signal, and she hasn't moved in a long time.

    "Slow the time-series," she commands. "By a hundred."

    It is a blink. 428's disk isn't darkening uniformly, it's eclipsing. As though a great eyelid were being drawn across the surface of the sun, from right to left.

    "By a thousand."

    Chromatophores, the chimp called them. But they're not all opening and closing at once. The darkness moves across the membrane in waves.

    She goes quiet for a moment, staring at the tank, and then: "Latency." The word comes out slow, like she's testing its weight. I know the word too. I've always known the word. It's one of the things the chimp taught me that it never explained why.

    "Chimp. Those waves of pigment. How fast are they moving?"

    "About fifty-nine thousand kilometers per second."

    The speed of a passing thought.

    And if this thing does think, it'll have logic gates, synapses — it's going to be a net of some kind. And if the net's big enough, there's an I in the middle of it. Just like her. Just like me. Just like the chimp. She says something under her breath — I can't make out the words, but her hand is flat against the tank's edge and her knuckles are white.

    The thing about I is, it only exists within a tenth-of-a-second of all its parts. When you get spread too thin — when someone splits your brain down the middle, say, chops the fat pipe so the halves have to talk the long way around; when the neural architecture diffuses past some critical point and signals take just that much longer to pass from A to B — the system, well, decoheres. The two sides of your brain become different people with different tastes, different agendas, different senses of themselves.

    I shatters into we.

    It's not just a human rule, or a mammal rule, or even an Earthly one. It's a rule for any circuit that processes information, and it applies as much to the things we've yet to meet as it did to those we left behind.

    Fifty-nine thousand kilometers per second, the chimp says. How far can the signal move through that membrane in a tenth of a corsec? How thinly does I spread itself across the heavens?

    The flesh is huge, the flesh is inconceivable. But the spirit, the spirit is —

    Shit.

    "Chimp. Assuming the mean neuron density of a human brain, what's the synapse count on a circular sheet of neurons one millimeter thick with a diameter of five thousand eight hundred ninety-two kilometers?"

    "Two times ten to the twenty-seventh."

    I saccade — she saccades — the database for some perspective on a mind stretched across thirty million square kilometers: the equivalent of two quadrillion human brains. Of course, whatever this thing uses for neurons have to be packed a lot less tightly than ours; we can see through them, after all. Let's be superconservative, say it's only got a thousandth the computational density of a human brain. That's —

    Okay, let's say it's only got a ten-thousandth the synaptic density, that's still —

    A hundred thousandth. The merest mist of thinking meat. Any more conservative and she'd hypothesize it right out of existence.

    Still more human brains than have ever lived. More, by a factor that stops meaning anything.

    I don't know how to feel about that. She doesn't either — I can see it in the way her hand hovers over the tank's controls and doesn't move. This is no mere alien. But she's not quite ready to believe in gods.
    {% else %}Phaeophytin and eumelanin, according to spectro. There are even hints of some kind of lead-based mineral pigment — a name I'll never remember, something that sounds like a brand of paint — soaking up X-rays in the picometer range. Chimp hypothesizes something called a chromatophore: branching cells with little aliquots of pigment inside, like particles of charcoal dust. Keep those particles clumped together and the cell's effectively transparent; spread them out through the cytoplasm and the whole structure darkens, dims whatever EM passes through from behind. Apparently there were animals back on Earth with cells like that. They could change color, pattern-match to their background, all sorts of things.

    "So there's a membrane of — of living tissue around that star," I say, trying to wrap my head around the concept. "A, a meat balloon. Around the whole damn star."

    "Yes," the chimp says.

    "But that's — Jesus, how thick would it be?"

    "No more than two millimeters. Probably less."

    "How so?"

    "If it was much thicker, it would be more obvious in the visible spectrum. It would have had a detectable effect on the von Neumanns when they hit it."

    "That's assuming that its — cells, I guess — are like ours."

    "The pigments are familiar; the rest might be too."

    It can't be too familiar. Nothing like a conventional gene would last two seconds in that environment. Not to mention whatever miracle solvent that thing must use as antifreeze...

    "Okay, let's be conservative, then. Say, mean thickness of a millimeter. Assume a density of water at STP. How much mass in the whole thing?"

    "Half the mass of Mercury," Dix and the chimp reply, almost in unison.

    "That's, uh..."

    "Half the mass of Mercury," the chimp adds helpfully.

    I whistle through my teeth. "And that's one organism?"

    "I don't know yet."

    "It's got organic pigments. Fuck, it's talking. It's intelligent."

    "Most cyclic emanations from living sources are simple biorhythms," the chimp points out. "Not intelligent signals."

    I ignore it and turn to Dix. "Assume it's a signal."

    He frowns. "Chimp says —"

    "Assume. Use your imagination."

    I'm not getting through to him. He looks nervous. He looks like that a lot, I realize.

    "If someone were signaling you," I say, "then what would you do?"

    "Signal..." Confusion on that face, and a fuzzy circuit closing somewhere "...back?"

    My son is an idiot.

    "And if the incoming signal takes the form of systematic changes in light intensity, how —"

    "Use the BI lasers, alternated to pulse between 700 and 3000 nanometers. Can boost an interlaced signal into the exawatt range without compromising our fenders; gives over a thousand Watts per square meter after diffraction. Way past detection threshold for anything that can sense thermal output from a red dwarf. And content doesn't matter if it's just a shout. Shout back. Test for echo."

    Okay, so my son is an idiot savant.

    And he still looks unhappy — "But Chimp, he says no real information there, right?" — and that whole other set of misgivings edges to the fore again: He. Dix takes my silence for amnesia. "Too simple, remember? Simple click train."

    I shake my head. There's more information in that signal than the chimp can imagine. There are so many things the chimp doesn't know. And the last thing I need is for this, this child to start deferring to it, to start looking to it as an equal or, God forbid, a mentor.

    Oh, it's smart enough to steer us between the stars. Smart enough to calculate million-digit primes in the blink of an eye. Even smart enough for a little crude improvisation should the crew go too far off-mission. Not smart enough to know a distress call when it sees one.

    "It's a deceleration curve," I tell them both. "It keeps slowing down. Over and over again. That's the message."

    Stop. Stop. Stop. Stop.

    And I think it's meant for no one but us. Shut down all desires and misgivings, conserve whatever life I have left for moments that matter. Remove myself from this sparse tactical intelligence, from this wet-eyed pup watching me as though I'm some kind of sorcerer about to vanish in a puff of smoke. He opens his mouth to speak, and I turn away and hurry down to oblivion.

    But I set my alarm to wake up alone.

    I linger in the coffin, grateful for small and ancient victories. The chimp's dead, blackened eye gazes down from the ceiling; in all these millions of years nobody's scrubbed off the carbon scoring. It's a trophy of sorts, a memento from the early incendiery days of our Great Struggle. There's still something — comforting, I guess — about that blind, endless stare.

    I'm reluctant to venture out where the chimp's nerves have not been so thoroughly cauterized. Childish, I know. The damn thing already knows I'm up; it may be blind, deaf, and impotent in here, but there's no way to mask the power the crypt sucks in during a thaw. And it's not as though a bunch of club-wielding teleops are waiting to pounce on me the moment I step outside. These are the days of détente, after all. The struggle continues but the war has gone cold; we just go through the motions now, rattling our chains like an old married multiplet resigned to hating each other to the end of time. After all the moves and countermoves, the truth is we need each other.

    A strange one, that. Not that you'd expect anyone born and raised on Eriophora to be an archetype of mental health, but Dix doesn't even know what side he's on. He doesn't even seem to know he has to choose a side. It's almost as though he read the original mission statements and took them seriously, believed in the literal truth of the ancient scrolls: Mammals and Machinery, working together across the ages to explore the Universe! United! Strong! Forward the Frontier!

    Rah.

    Whoever raised him didn't do a great job. Not that I blame them; it can't have been much fun having a child underfoot during a build, and none of us were selected for our parenting skills. Even if bots changed the diapers and VR handled the infodumps, socializing a toddler couldn't have been anyone's idea of a good time. I'd have probably just chucked the little bastard out an airlock.

    But even I would've brought him up to speed.

    Something changed while I was away. Maybe the war's heated up again, entered some new phase. That twitchy kid is out of the loop for a reason. I wonder what it is. I wonder if I care.

    I arrive at my suite, treat myself to a gratuitous meal, jerk off. Three hours later I'm relaxing in the starbow commons. "Chimp."

    "You're up early," it says at last, and I am; our answering shout hasn't even arrived at its destination yet. No real chance of new data for another two months, at least.

    "Show me the forward feeds," I command.

    DHF428 blinks at me from the center of the lounge: Stop. Stop. Stop.

    Maybe. Or maybe the chimp's right, maybe it's pure physiology. Maybe this endless cycle carries no more intelligence than the beating of a heart. But there's a pattern inside the pattern, some kind of flicker in the blink. It makes my brain itch.

    "Slow the time-series," I command. "By a hundred."

    It is a blink. 428's disk isn't darkening uniformly, it's eclipsing. As though a great eyelid were being drawn across the surface of the sun, from right to left.

    "By a thousand."

    Chromatophores, the chimp called them. But they're not all opening and closing at once. The darkness moves across the membrane in waves.

    A word pops into my head: latency.

    "Chimp. Those waves of pigment. How fast are they moving?"

    "About fifty-nine thousand kilometers per second."

    The speed of a passing thought.

    And if this thing does think, it'll have logic gates, synapses — it's going to be a net of some kind. And if the net's big enough, there's an I in the middle of it. Just like me, just like Dix. Just like the chimp. (Which is why I educated myself on the subject, back in the early tumultuous days of our relationship. Know your enemy and all that.)

